name: Deploy AI Gateway

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "Cloudflare Account ID (32 characters)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker
        run: npm run check

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          ACCOUNT_ID="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"

          if ! printf '%s' "$ACCOUNT_ID" | grep -Eq '^[A-Fa-f0-9]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be exactly 32 hexadecimal characters."
            exit 1
          fi

          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          npm run deploy
