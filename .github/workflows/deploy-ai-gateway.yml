name: Deploy AI Gateway

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "Cloudflare Account ID"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate
        run: npm run check

      - name: Verify Cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ inputs.account_id }}
        run: |
          set -e
          if [ -z "$TOKEN" ]; then echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; fi
          if ! echo "$ACCOUNT_ID" | grep -Eq '^[a-fA-F0-9]{32}$'; then echo "Invalid Account ID"; exit 1; fi
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/tokens/verify" \
            > /tmp/cf.json
          cat /tmp/cf.json

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id }}
        run: npm run deploy
