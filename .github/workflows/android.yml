name: Android CI

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        env:
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Compile instrumented PDF import test
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Build release APK
        env:
          AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HTeacher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HTeacher-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


  ai-gateway-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/ai-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install gateway dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Cloudflare Worker
        run: npm run check

  curriculum-import-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # udev may not apply the rule immediately on hosted runners.
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "KVM acceleration is accessible"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Test selecting and persisting a real PDF
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            # A running emulator process is not sufficient: ADB must see an online device.
            adb wait-for-device
            for attempt in $(seq 1 24); do
              if adb shell getprop sys.boot_completed 2>/dev/null | grep -q '^1

      - name: Upload PDF import test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-pdf-import-test-report
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
