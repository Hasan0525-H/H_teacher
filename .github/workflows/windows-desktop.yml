name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktopApp/**'
      - 'shared/**'
      - '.github/workflows/windows-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test shared module
        run: gradle :shared:test --stacktrace

      - name: Build Android debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Package Windows application
        run: gradle :desktopApp:packageExe --stacktrace

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTeacher-Windows
          path: desktopApp/build/compose/binaries/**/*.exe
