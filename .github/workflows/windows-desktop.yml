name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktopApp/**'
      - 'shared/**'
      - '.github/workflows/windows-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test shared module
        run: .\gradlew.bat :shared:test

      - name: Build Android debug
        run: .\gradlew.bat :app:assembleDebug

      - name: Package Windows application
        run: .\gradlew.bat :desktopApp:packageExe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTeacher-Windows
          path: desktopApp/build/compose/binaries/**/*.exe
